[package]
name = "battwarn"
version = "1.0.0"
edition = "2021"
description = "Battery watchdog for Windows 11 - warns you before the laptop dies"
authors = ["battwarn"]
license = "MIT"

[[bin]]
name = "battwarn"
path = "src/main.rs"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
